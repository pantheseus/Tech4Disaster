<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report Emergency - Tech4Disaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* All labels and text must be light */
    .form-label { color: var(--text) !important; }
    h4, h5, h6 { color: var(--text) !important; }
    /* AI analysis box content */
    .ai-box label, .ai-box span, .ai-box div { color: var(--text) !important; }
    .ai-box .muted { color: var(--muted) !important; }
    /* Alert text */
    .alert-danger { color: #f8d7da !important; }
    /* Coord display text */
    #coords { color: var(--muted) !important; }
    /* Success/error messages */
    #msg.text-success { color: #5bd18a !important; }
    #msg.text-danger  { color: #ff3b3b !important; }
  </style>
</head>
<body>
<div id="nav"></div>
<div class="container py-3" style="max-width: 900px">
  <h4 class="mb-3">Report an emergency</h4>
  <div class="card-dark p-3">
    <div class="alert alert-danger py-2 small">For life-threatening emergencies call <b>112</b> first.</div>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">What is happening?</label>
        <textarea id="desc" class="form-control" rows="4" placeholder="e.g. Water is entering our house, two children and an elderly person are on the first floor"></textarea>

        <label class="form-label mt-3">Photo (optional)</label>
        <input type="file" id="photo" class="form-control" accept="image/*" capture="environment">
        <img id="preview" class="mt-2 d-none" style="max-width:100%;max-height:160px;border-radius:8px">

        <label class="form-label mt-3">Contact number (optional)</label>
        <input id="contact" class="form-control" placeholder="Phone number" maxlength="30">
      </div>
      <div class="col-md-6">
        <label class="form-label">Location <span class="muted small">(click the map or use GPS)</span></label>
        <div id="pick-map"></div>
        <div class="d-flex gap-2 mt-2 align-items-center">
          <button class="btn btn-sm btn-outline-warning" id="btn-gps">Use my location</button>
          <span class="muted small" id="coords">No location selected</span>
        </div>
      </div>
    </div>

    <hr class="border-secondary">
    <button class="btn btn-outline-info" id="btn-ai">AI triage</button>
    <span class="muted small ms-2">Detects the type and severity from your text and photo</span>

    <div class="ai-box mt-3 d-none" id="ai-box">
      <div class="row g-2">
        <div class="col-md-4"><label class="form-label small">Type</label>
          <select id="type" class="form-select form-select-sm">
            <option>flood</option><option>fire</option><option>medical</option><option>accident</option><option>earthquake</option>
            <option>cyclone</option><option>landslide</option><option>infrastructure</option><option selected>other</option>
          </select></div>
        <div class="col-md-4"><label class="form-label small">Severity (1-5)</label>
          <input id="severity" type="number" min="1" max="5" value="3" class="form-control form-control-sm"></div>
        <div class="col-md-4"><label class="form-label small">Analysis source</label>
          <div id="ai-src" class="form-control form-control-sm" style="background:transparent;border:0"></div></div>
      </div>
      <div class="small mt-2"><b>Summary:</b> <span id="ai-summary"></span></div>
      <div class="small"><b>Suggested action:</b> <span id="ai-action"></span></div>
    </div>

    <div class="mt-3 d-flex gap-2 align-items-center">
      <button class="btn btn-accent" id="btn-submit">Submit report</button>
      <span id="msg" class="small"></span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="js/api.js"></script>
<script>
navbar("report.html");
let lat = null, lng = null, pin = null, analysis = null;
const $ = (id) => document.getElementById(id);

const map = L.map("pick-map").setView([8.7139, 77.7567], 12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
getJSON("/health").then(h => map.setView(h.map_center, 12)).catch(() => {});

function setLocation(a, b, zoom) {
  lat = a; lng = b;
  if (pin) pin.setLatLng([a, b]); else pin = L.marker([a, b]).addTo(map);
  if (zoom) map.setView([a, b], 15);
  $("coords").textContent = `${a.toFixed(5)}, ${b.toFixed(5)}`;
}
map.on("click", (e) => setLocation(e.latlng.lat, e.latlng.lng));
$("btn-gps").onclick = () => {
  if (!navigator.geolocation) return alert("GPS not supported on this device");
  navigator.geolocation.getCurrentPosition(
    (p) => setLocation(p.coords.latitude, p.coords.longitude, true),
    () => alert("Could not get location. Click on the map instead."),
    { enableHighAccuracy: true, timeout: 10000 });
};
$("photo").onchange = () => {
  const f = $("photo").files[0];
  if (f) { $("preview").src = URL.createObjectURL(f); $("preview").classList.remove("d-none"); }
};

$("btn-ai").onclick = async () => {
  const text = $("desc").value.trim();
  if (text.length < 3) return ($("msg").textContent = "Describe the emergency first.");
  $("btn-ai").disabled = true; $("btn-ai").textContent = "Analyzing...";
  try {
    const fd = new FormData(); fd.append("text", text);
    if ($("photo").files[0]) fd.append("file", $("photo").files[0]);
    analysis = await sendForm("/ai/analyze", fd);
    $("type").value = analysis.category; $("severity").value = analysis.severity;
    $("ai-summary").textContent = analysis.summary; $("ai-action").textContent = analysis.suggested_action;
    $("ai-src").textContent = "via " + analysis.source;
    $("ai-box").classList.remove("d-none"); $("msg").textContent = "";
  } catch (e) { $("msg").className = "small text-danger"; $("msg").textContent = "AI failed: " + e.message; }
  $("btn-ai").disabled = false; $("btn-ai").textContent = "AI triage";
};

$("btn-submit").onclick = async () => {
  const description = $("desc").value.trim();
  if (description.length < 3) return ($("msg").textContent = "Please describe the emergency.");
  if (lat === null) return ($("msg").textContent = "Please choose a location on the map or use GPS.");
  $("btn-submit").disabled = true; $("msg").className = "small muted"; $("msg").textContent = "Submitting...";
  try {
    let photo_url = null;
    if ($("photo").files[0]) {
      const fd = new FormData(); fd.append("file", $("photo").files[0]);
      photo_url = (await sendForm("/upload", fd)).url;
    }
    await sendJSON("/reports", {
      type: $("type").value, description, lat, lng,
      severity: Math.max(1, Math.min(5, parseInt($("severity").value) || 3)),
      photo_url, contact: $("contact").value.trim() || null,
      ai_summary: analysis?.summary || null, ai_action: analysis?.suggested_action || null
    });
    $("msg").className = "small text-success";
    $("msg").innerHTML = 'Report submitted. Responders can see it on the <a href="index.html">dashboard</a>.';
    $("desc").value = ""; $("photo").value = ""; $("preview").classList.add("d-none"); $("ai-box").classList.add("d-none"); analysis = null;
  } catch (e) { $("msg").className = "small text-danger"; $("msg").textContent = "Failed: " + e.message; }
  $("btn-submit").disabled = false;
};
</script>
</body>
</html>
