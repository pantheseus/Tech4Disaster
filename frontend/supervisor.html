<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supervisor Dashboard – CallPrior</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .kpi-big { padding: 18px 20px; color: var(--text); }
    .kpi-big .num { font-size: 2.4rem; font-weight: 800; color: var(--accent2) !important; line-height: 1; }
    .kpi-big .lbl { color: var(--muted) !important; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
    .kpi-big .sub { font-size: .75rem; color: var(--muted) !important; }
    .sla-ok   { color: #5bd18a !important; }
    .sla-warn { color: #ff8a00 !important; }
    .sla-crit { color: #ff3b3b !important; }
    .unit-row { padding: 7px 14px; border-bottom: 1px solid #2c2c38; color: var(--text); }
    .unit-row:hover { background: #22222c; }
    .unit-row b { color: var(--text) !important; }
    .unit-row .muted { color: var(--muted) !important; }
    .u-available { color: #5bd18a !important; font-weight: 700; }
    .u-busy      { color: #ff8a00 !important; font-weight: 700; }
    .u-offline   { color: #6c757d !important; font-weight: 700; }
    .bar-track { height: 10px; background: #2c2c38; border-radius: 5px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 5px; transition: width .4s; }
    .badge-type { background:#2c2c38; color:#ffd400 !important; border-radius:8px; padding:3px 10px; font-size:.75rem; display:inline-block; margin:2px; }
    #refresh-countdown { font-size: .75rem; color: var(--muted) !important; }
    /* bar chart labels */
    #by-type span, #by-type .muted,
    #by-severity span, #by-severity .muted { color: var(--text); }
    #by-type .muted, #by-severity .muted { color: var(--muted) !important; }
    /* SLA box */
    #sla-box { color: var(--text); }
    /* Section headings inside cards */
    .card-dark .fw-bold { color: var(--text) !important; }
    /* h4 */
    h4 { color: var(--text) !important; }
  </style>
</head>
<body>
<div id="nav"></div>

<div class="container-fluid p-3">
  <div class="d-flex align-items-center mb-3 gap-3">
    <h4 class="mb-0">📊 Supervisor Dashboard</h4>
    <span id="refresh-countdown" class="ms-auto">Next refresh in 15s</span>
    <button class="btn btn-sm btn-outline-secondary" id="btn-refresh">↺ Refresh now</button>
  </div>

  <!-- KPI row -->
  <div class="row g-3 mb-4" id="kpi-row"></div>

  <div class="row g-3">
    <!-- By incident type -->
    <div class="col-lg-4">
      <div class="card-dark p-3 h-100">
        <div class="fw-bold mb-3">Calls by Incident Type</div>
        <div id="by-type"></div>
      </div>
    </div>

    <!-- By severity -->
    <div class="col-lg-4">
      <div class="card-dark p-3 h-100">
        <div class="fw-bold mb-3">Calls by Severity</div>
        <div id="by-severity"></div>
      </div>
    </div>

    <!-- SLA summary -->
    <div class="col-lg-4">
      <div class="card-dark p-3 h-100">
        <div class="fw-bold mb-3">SLA &amp; Response Times</div>
        <div id="sla-box"></div>
      </div>
    </div>

    <!-- Unit roster -->
    <div class="col-12">
      <div class="card-dark">
        <div class="p-2 px-3 fw-bold border-bottom border-secondary">Response Unit Roster</div>
        <div id="unit-roster"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
navbar("supervisor.html");

const SEV_LABELS = { "1": "Sev-1 (Minimal)", "2": "Sev-2 (Minor)", "3": "Sev-3 (Moderate)", "4": "Sev-4 (High)", "5": "Sev-5 (Critical)" };
const SEV_COLORS_BAR = { "1": "#5bd18a", "2": "#a8d85b", "3": "#ffd400", "4": "#ff8a00", "5": "#ff3b3b" };
const TYPE_EMOJI = { flood:"🌊", fire:"🔥", medical:"🏥", accident:"🚗", earthquake:"🌋", cyclone:"🌪", landslide:"⛰", infrastructure:"🔧", other:"📋" };

async function loadMetrics() {
  const [m, units] = await Promise.all([getJSON("/metrics"), getJSON("/units")]);
  renderKPIs(m);
  renderByType(m.by_type, m.total_calls);
  renderBySeverity(m.by_severity, m.total_calls);
  renderSLA(m);
  renderUnits(units, m);
}

function renderKPIs(m) {
  const slaColor = m.sla_compliance_pct >= 90 ? "sla-ok" : m.sla_compliance_pct >= 70 ? "sla-warn" : "sla-crit";
  const kpis = [
    { num: m.total_calls,          lbl: "Total Calls",         sub: "" },
    { num: m.waiting,              lbl: "Currently Waiting",   sub: m.critical_waiting + " critical/high" },
    { num: m.assigned,             lbl: "Assigned",            sub: "" },
    { num: m.closed,               lbl: "Closed / Resolved",   sub: "" },
    { num: m.sla_breaches,         lbl: "SLA Breaches",        sub: "", cls: m.sla_breaches > 0 ? "sla-crit" : "sla-ok" },
    { num: m.sla_compliance_pct + "%", lbl: "SLA Compliance",  sub: "", cls: slaColor },
    { num: fmtTime(m.avg_time_to_assign_seconds), lbl: "Avg. Time to Assign", sub: "" },
    { num: fmtTime(m.longest_wait_seconds),       lbl: "Longest Current Wait", sub: "", cls: m.longest_wait_seconds > 300 ? "sla-warn" : "" },
    { num: m.units_available + "/" + m.units_total, lbl: "Units Available",   sub: m.units_busy + " busy" },
  ];
  document.getElementById("kpi-row").innerHTML = kpis.map(k => `
    <div class="col-6 col-md-4 col-xl-3">
      <div class="card-dark kpi-big">
        <div class="num ${k.cls || ""}">${esc(k.num ?? "—")}</div>
        <div class="lbl">${k.lbl}</div>
        ${k.sub ? `<div class="sub">${esc(k.sub)}</div>` : ""}
      </div>
    </div>`).join("");
}

function renderByType(byType, total) {
  const sorted = Object.entries(byType).sort((a, b) => b[1] - a[1]);
  const max = sorted[0]?.[1] || 1;
  document.getElementById("by-type").innerHTML = sorted.map(([type, cnt]) => `
    <div class="mb-3">
      <div class="d-flex justify-content-between mb-1">
        <span>${TYPE_EMOJI[type] || "📋"} <span class="text-capitalize">${esc(type)}</span></span>
        <span class="muted small">${cnt} (${Math.round(100*cnt/total)}%)</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${Math.round(100*cnt/max)}%;background:var(--accent)"></div>
      </div>
    </div>`).join("") || '<div class="muted">No data yet.</div>';
}

function renderBySeverity(bySev, total) {
  const order = ["5","4","3","2","1"];
  const max = Math.max(...Object.values(bySev || {}), 1);
  document.getElementById("by-severity").innerHTML = order.map(s => {
    const cnt = bySev[s] || 0;
    return `
    <div class="mb-3">
      <div class="d-flex justify-content-between mb-1">
        <span><span class="sev sev-${s}">${s}</span> ${esc(SEV_LABELS[s])}</span>
        <span class="muted small">${cnt}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${Math.round(100*cnt/max)}%;background:${SEV_COLORS_BAR[s]}"></div>
      </div>
    </div>`;
  }).join("");
}

function renderSLA(m) {
  const slaColor = m.sla_compliance_pct >= 90 ? "#5bd18a" : m.sla_compliance_pct >= 70 ? "#ff8a00" : "#ff3b3b";
  document.getElementById("sla-box").innerHTML = `
    <div class="mb-3">
      <div class="d-flex justify-content-between mb-1">
        <span>SLA Compliance</span>
        <span style="color:${slaColor};font-weight:700">${m.sla_compliance_pct}%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${m.sla_compliance_pct}%;background:${slaColor}"></div>
      </div>
    </div>
    <table class="table table-sm table-dark mb-0">
      <tr><th>SLA Breaches</th><td>${m.sla_breaches}</td></tr>
      <tr><th>Avg Assign Time</th><td>${fmtTime(m.avg_time_to_assign_seconds)}</td></tr>
      <tr><th>Avg Close Time</th><td>${fmtTime(m.avg_time_to_close_seconds)}</td></tr>
      <tr><th>Longest Wait</th><td class="${m.longest_wait_seconds>300?'sla-warn':''}">${fmtTime(m.longest_wait_seconds)}</td></tr>
      <tr><th>Critical Waiting</th><td class="${m.critical_waiting>0?'sla-crit':''}">${m.critical_waiting}</td></tr>
    </table>`;
}

function renderUnits(units, m) {
  const UNIT_EMOJI = { ambulance:"🚑", fire_tender:"🚒", rescue_boat:"⛵", rescue_team:"🦺", police:"🚔" };
  document.getElementById("unit-roster").innerHTML = units.map(u => `
    <div class="unit-row d-flex align-items-center gap-3">
      <span style="font-size:1.3rem">${UNIT_EMOJI[u.type] || "🚗"}</span>
      <div style="min-width:160px"><b>${esc(u.name)}</b><br><span class="muted small">${esc(u.type)}</span></div>
      <span class="u-${u.status === 'available' ? 'available' : u.status} fw-bold">${esc(u.status.toUpperCase())}</span>
      <span class="muted small ms-2">${u.current_call_summary ? "On call: " + esc(u.current_call_summary) : ""}</span>
      <span class="muted small ms-auto">${u.lat.toFixed(4)}, ${u.lng.toFixed(4)}</span>
    </div>`).join("") || '<div class="p-3 muted">No units registered.</div>';
}

function fmtTime(s) {
  if (!s && s !== 0) return "—";
  if (s < 60) return Math.round(s) + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + Math.round(s % 60) + "s";
  return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
}

// -------- Auto-refresh countdown --------
let countdown = 15;
function tick() {
  countdown--;
  document.getElementById("refresh-countdown").textContent = `Next refresh in ${countdown}s`;
  if (countdown <= 0) { countdown = 15; loadMetrics(); }
}

document.getElementById("btn-refresh").onclick = () => { countdown = 15; loadMetrics(); };

loadMetrics();
setInterval(tick, 1000);
</script>
</body>
</html>
