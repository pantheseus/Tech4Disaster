<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Command Dashboard - Tech4Disaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Ensure all text inside dark cards is light */
    .report-item b, .report-item span, .report-item div { color: var(--text); }
    .report-item .muted, .report-item .small.muted { color: var(--muted) !important; }
    /* Stats section */
    #stats .num { color: var(--accent2) !important; }
    #stats .lbl { color: var(--muted) !important; }
    /* Weather card */
    #weather { color: var(--text); }
    /* Filter controls label text */
    #list .fw-bold { color: var(--text) !important; }
    .border-bottom.border-secondary { border-color: #2c2c38 !important; }
  </style>
</head>
<body>
<div id="nav"></div>
<div id="alert-banner"></div>

<div class="container-fluid p-3">
  <div class="row g-3 mb-3" id="stats"></div>

  <div class="row g-3">
    <div class="col-lg-8">
      <div class="d-flex flex-wrap gap-2 mb-2 align-items-center">
        <select id="f-type" class="form-select form-select-sm w-auto">
          <option value="">All types</option>
          <option>flood</option><option>fire</option><option>medical</option><option>accident</option><option>earthquake</option>
          <option>cyclone</option><option>landslide</option><option>infrastructure</option><option>other</option>
        </select>
        <select id="f-status" class="form-select form-select-sm w-auto">
          <option value="">All status</option><option>open</option><option>assigned</option><option>resolved</option>
        </select>
        <div class="form-check form-switch ms-1"><input class="form-check-input" type="checkbox" id="f-shelters" checked><label class="form-check-label small" for="f-shelters">Shelters</label></div>
        <button class="btn btn-sm btn-outline-warning ms-auto" id="btn-alert">Send alert</button>
        <button class="btn btn-sm btn-outline-secondary" id="btn-seed" title="Reset to demo data">Reset demo data</button>
      </div>
      <div id="map"></div>
    </div>

    <div class="col-lg-4">
      <div class="card-dark p-3 mb-3" id="weather">Loading weather...</div>
      <div class="card-dark">
        <div class="p-2 px-3 fw-bold border-bottom border-secondary">Priority queue <span class="muted small">(most severe first)</span></div>
        <div class="report-list" id="list"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="js/api.js"></script>
<script>
navbar("index.html");
let map, reportLayer, shelterLayer, center = [8.7139, 77.7567];
const markers = {};

function initMap() {
  map = L.map("map").setView(center, 12);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);
  reportLayer = L.layerGroup().addTo(map);
  shelterLayer = L.layerGroup().addTo(map);
}

function reportIcon(sev, status) {
  const color = status === "resolved" ? "#6c757d" : SEV_COLORS[sev];
  return L.divIcon({
    className: "",
    html: `<div class="${sev === 5 && status !== "resolved" ? "pulse" : ""}" style="background:${color};width:22px;height:22px;border-radius:50%;border:2px solid #fff;color:#111;font-weight:800;font-size:12px;text-align:center;line-height:18px">${sev}</div>`,
    iconSize: [22, 22], iconAnchor: [11, 11]
  });
}

async function loadAll() {
  const type = document.getElementById("f-type").value;
  const status = document.getElementById("f-status").value;
  const qs = new URLSearchParams(); if (type) qs.set("type", type); if (status) qs.set("status", status);
  const [reports, shelters, stats, alerts] = await Promise.all([
    getJSON("/reports?" + qs), getJSON("/shelters"), getJSON("/stats"), getJSON("/alerts")
  ]);
  renderStats(stats); renderAlerts(alerts); renderMap(reports, shelters); renderList(reports);
}

function renderStats(s) {
  const pct = s.shelter_capacity ? Math.round(100 * s.shelter_occupied / s.shelter_capacity) : 0;
  const items = [
    [s.total_reports, "Total reports"], [s.critical_reports, "Critical & unresolved"],
    [s.by_status.open || 0, "Open"], [s.by_status.assigned || 0, "Assigned"],
    [s.by_status.resolved || 0, "Resolved"], [pct + "%", `Shelter occupancy (${s.shelter_occupied}/${s.shelter_capacity})`]
  ];
  document.getElementById("stats").innerHTML = items.map(([n, l]) =>
    `<div class="col-6 col-md-4 col-xl-2"><div class="card-dark stat"><div class="num">${esc(n)}</div><div class="lbl">${esc(l)}</div></div></div>`).join("");
}

function renderAlerts(alerts) {
  const el = document.getElementById("alert-banner");
  if (!alerts.length) { el.innerHTML = ""; return; }
  const a = alerts[0];
  const cls = a.level === "danger" ? "danger" : a.level === "info" ? "info" : "warning";
  el.innerHTML = `<div class="alert alert-${cls}">&#9888; ${esc(a.message)}</div>`;
}

function renderMap(reports, shelters) {
  reportLayer.clearLayers(); shelterLayer.clearLayers();
  reports.forEach(r => {
    const m = L.marker([r.lat, r.lng], { icon: reportIcon(r.severity, r.status) });
    m.bindPopup(`<b>${esc(r.type).toUpperCase()}</b> (severity ${r.severity})<br>${esc(r.description)}<br>
      <small>Status: ${esc(r.status)}${r.contact ? " | " + esc(r.contact) : ""}</small>
      ${r.photo_url ? `<br><img src="${esc(r.photo_url)}" style="max-width:200px;border-radius:6px;margin-top:6px">` : ""}`);
    m.addTo(reportLayer); markers[r.id] = m;
  });
  if (document.getElementById("f-shelters").checked) {
    shelters.forEach(s => {
      const pct = s.capacity ? Math.round(100 * s.occupied / s.capacity) : 0;
      const m = L.marker([s.lat, s.lng], { icon: L.divIcon({ className: "", iconSize: [26, 26], iconAnchor: [13, 13],
        html: `<div style="background:#2d7ff9;width:26px;height:26px;border-radius:6px;border:2px solid #fff;color:#fff;text-align:center;line-height:22px;font-weight:800">H</div>` }) });
      m.bindPopup(`<b>${esc(s.name)}</b><br>Occupancy: ${s.occupied}/${s.capacity} (${pct}%)<br>
        Food: ${s.food ? "yes" : "no"} | Medical: ${s.medical ? "yes" : "no"}<br>${esc(s.contact || "")}`);
      m.addTo(shelterLayer);
    });
  }
}

function renderList(reports) {
  const el = document.getElementById("list");
  if (!reports.length) { el.innerHTML = '<div class="p-3 muted">No reports.</div>'; return; }
  el.innerHTML = reports.map(r => `
    <div class="report-item" data-id="${r.id}">
      <div class="d-flex justify-content-between align-items-center">
        <span><span class="sev sev-${r.severity}">${r.severity}</span> <b class="text-capitalize">${esc(r.type)}</b></span>
        <span class="muted small">${timeAgo(r.created_at)}</span>
      </div>
      <div class="small mt-1">${esc(r.description)}</div>
      <div class="mt-1 d-flex gap-1 align-items-center">
        <span class="badge text-bg-secondary badge-status">${esc(r.status)}</span>
        ${r.status === "open" ? `<button class="btn btn-sm btn-outline-info py-0" data-act="assigned" data-id="${r.id}">Assign</button>` : ""}
        ${r.status !== "resolved" ? `<button class="btn btn-sm btn-outline-success py-0" data-act="resolved" data-id="${r.id}">Resolve</button>` : ""}
      </div>
    </div>`).join("");
}

document.getElementById("list").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-act]");
  if (btn) {
    await sendJSON(`/reports/${btn.dataset.id}`, { status: btn.dataset.act }, "PATCH");
    return loadAll();
  }
  const item = e.target.closest(".report-item");
  if (item && markers[item.dataset.id]) {
    const m = markers[item.dataset.id];
    map.setView(m.getLatLng(), 15); m.openPopup();
  }
});

async function loadWeather() {
  const el = document.getElementById("weather");
  try {
    const w = await getJSON(`/external/weather?lat=${center[0]}&lng=${center[1]}`);
    const c = w.current || {};
    const color = w.flood_risk === "HIGH" ? "#ff3b3b" : w.flood_risk === "MEDIUM" ? "#ff8a00" : "#5bd18a";
    el.innerHTML = `<div class="d-flex justify-content-between"><b>Live weather</b><span style="color:${color};font-weight:800">Flood risk: ${esc(w.flood_risk)}</span></div>
      <div class="muted small">Temp ${esc(c.temperature_2m)}&deg;C | Humidity ${esc(c.relative_humidity_2m)}% | Wind ${esc(c.wind_speed_10m)} km/h</div>
      <div class="muted small">Forecast rain next 3 days: <b class="text-white">${esc(w.rain_3day_mm)} mm</b> (source: Open-Meteo)</div>`;
  } catch (e) { el.innerHTML = '<span class="muted">Weather unavailable (offline?)</span>'; }
}

document.getElementById("f-type").onchange = loadAll;
document.getElementById("f-status").onchange = loadAll;
document.getElementById("f-shelters").onchange = loadAll;
document.getElementById("btn-seed").onclick = async () => {
  if (confirm("Reset all data to the demo data?")) { await sendJSON("/seed", {}); loadAll(); }
};
document.getElementById("btn-alert").onclick = async () => {
  const message = prompt("Alert message to broadcast:");
  if (message && message.trim().length >= 3) {
    await sendJSON("/alerts", { level: "danger", message: message.trim() }); loadAll();
  }
};

(async () => {
  initMap();
  try { const h = await getJSON("/health"); center = h.map_center; map.setView(center, 12); } catch (_) {}
  await loadAll(); loadWeather();
  setInterval(loadAll, 10000);   // live refresh
})();
</script>
</body>
</html>
